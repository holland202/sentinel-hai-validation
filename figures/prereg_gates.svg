<svg xmlns="http://www.w3.org/2000/svg" width="680" height="406" viewBox="0 0 680 406" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Prereg gate structure — sentinel-hai-validation</title>
<desc>Anti-vacuity controls P0a and P0b gate the reporting of P1, P2 and P3. P4 is left unrun.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="406" fill="#ffffff"/>
<rect x="60" y="30" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="185" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">P0a normal-vs-normal</text>
<text x="185" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">clean slice, no attacks</text>
<rect x="370" y="30" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">P0b FDIA control</text>
<text x="495" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">0 of 200, then 190 of 200</text>
<path d="M185 86 L185 112 L340 112 L340 138" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 86 L495 112 L340 112" fill="none" stroke="#73726c" stroke-width="1.5"/>
<rect x="215" y="140" width="250" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="162" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Both pass?</text>
<line x1="300" y1="184" x2="160" y2="216" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="184" x2="340" y2="216" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="184" x2="520" y2="216" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="75" y="220" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="160" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">P1 metrics</text>
<text x="160" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">F1 vs eTaPR disagree</text>
<rect x="255" y="220" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">P2 floor</text>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">suspended, amendment 1</text>
<rect x="435" y="220" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="520" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">P3 coverage</text>
<text x="520" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">drift failure repeats</text>
<rect x="215" y="310" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">P4 left unrun</text>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">the door</text>
