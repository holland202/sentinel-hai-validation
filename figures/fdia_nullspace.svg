<svg xmlns="http://www.w3.org/2000/svg" width="380" height="330" viewBox="0 0 380 330" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Why structured false data injection is invisible to residual detection</title>
<desc>An injection along the column space of H leaves the residual unchanged; an injection off that space increases the residual and is detected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="380" height="330" fill="#ffffff"/>
<polygon points="40,225 175,190 340,225 205,262" fill="#5DCAA5" fill-opacity="0.22" stroke="#0F6E56" stroke-width="0.5"/>
<text x="52" y="252" font-size="12" fill="#0F6E56">column space of H</text>
<circle cx="180" cy="226" r="4" fill="#0F6E56"/>
<line x1="180" y1="226" x2="288" y2="204" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="180" y1="226" x2="180" y2="120" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="180" y1="120" x2="180" y2="226" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="192" y="140" font-size="12" fill="#A32D2D">residual grows</text>
<text x="192" y="158" font-size="12" fill="#A32D2D">detected</text>
<text x="246" y="172" font-size="12" fill="#0F6E56">residual unchanged</text>
<text x="246" y="188" font-size="12" fill="#0F6E56">a = Hc</text>
<rect x="40" y="282" width="150" height="30" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="115" y="297" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F">unstructured: caught</text>
<rect x="200" y="282" width="140" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="270" y="297" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">structured: invisible</text>
</svg>
